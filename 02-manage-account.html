/* ---- inlined from ./tokens.css ---- */
/* =========================================================================
   Coalition Design System — Tokens
   Source of truth: Figma "Global Tokens / Base" + "Themes / Light".
   Two layers:
     1. BASE — raw primitives, mirrored 1:1 from Figma palettes
     2. SEMANTIC — friendly role-based names that components should consume
   Components should reach for the SEMANTIC layer first; only drop to the
   BASE layer when no semantic token fits.
   ========================================================================= */

:root {
  /* =====================================================================
     LAYER 1 · BASE — Colors
     Stops 5 / 10 / 50 / 100 / 120 / 140 match Figma exactly.
     ===================================================================== */

  /* Base */
  --color-white: #ffffff;
  --color-black: #000000;

  /* Grey scale */
  --color-grey-10: #fafafa;
  --color-grey-20: #f5f5f5;
  --color-grey-30: #eeeeee;
  --color-grey-40: #e0e0e0;
  --color-grey-50: #bdbdbd;
  --color-grey-60: #9e9e9e;
  --color-grey-70: #616161;
  --color-grey-80: #303030;
  --color-grey-90: #1a1a1a;

  /* Blue */
  --color-blue-5:   #f5f9fe;
  --color-blue-10:  #d5e2f7;
  --color-blue-50:  #80a9e7;
  --color-blue-100: #2b70d7;   /* Coalition Blue */
  --color-blue-120: #1e53a1;
  --color-blue-140: #143669;

  /* Teal */
  --color-teal-5:   #f6fdfd;
  --color-teal-10:  #e0f2f1;
  --color-teal-50:  #9cdcd6;
  --color-teal-100: #5ac4ba;
  --color-teal-120: #339188;
  --color-teal-140: #1c4f4a;

  /* Green */
  --color-green-5:   #f6fbf7;
  --color-green-10:  #e8f5e9;
  --color-green-50:  #a5d6a7;
  --color-green-100: #4caf50;
  --color-green-120: #357a38;
  --color-green-140: #1e4620;

  /* Yellow */

  --color-yellow-10:  #fffbe6;
  --color-yellow-50:  #ffed99;
  --color-yellow-100: #ffd200;
  --color-yellow-120: #997e00;
  --color-yellow-140: #665400;

  /* Orange */
  --color-orange-5:   #fffbf6;
  --color-orange-10:  #fee9d3;
  --color-orange-50:  #fdbc7b;
  --color-orange-100: #fc9023;
  --color-orange-120: #d16b03;
  --color-orange-140: #884502;

  /* Purple */
  --color-purple-5:   #f9f5ff;
  --color-purple-10:  #ebdff4;
  --color-purple-50:  #c29edf;
  --color-purple-100: #9a5dca;
  --color-purple-120: #7436a4;
  --color-purple-140: #4b236a;

  /* Burple */

  --color-burple-10:  #ebe8fa;
  --color-burple-50:  #a095e9;
  --color-burple-100: #614eda;
  --color-burple-120: #3926b5;
  --color-burple-140: #251875;

  /* Red */

  --color-red-10:  #ffebee;
  --color-red-50:  #ef9a9a;
  --color-red-100: #e53935;
  --color-red-120: #c62828;

     ===================================================================== */

  --alpha-black-20: rgba(0,0,0,0.20);
  --alpha-black-40: rgba(0,0,0,0.40);
  --alpha-black-60: rgba(0,0,0,0.60);

  --alpha-blue-5:  rgba(43,112,215,0.05);
  --alpha-blue-15: rgba(43,112,215,0.15);
  --alpha-blue-20: rgba(43,112,215,0.20);

  --alpha-blue-80: rgba(43,112,215,0.80);

  --alpha-teal-5:  rgba(90,196,186,0.05);
  --alpha-teal-15: rgba(90,196,186,0.15);
  --alpha-teal-20: rgba(90,196,186,0.20);
  --alpha-teal-40: rgba(90,196,186,0.40);
  --alpha-teal-60: rgba(90,196,186,0.60);
  --alpha-teal-80: rgba(90,196,186,0.80);

  --alpha-green-5:  rgba(76,175,80,0.05);
  --alpha-green-15: rgba(76,175,80,0.15);
  --alpha-green-20: rgba(76,175,80,0.20);
  --alpha-green-40: rgba(76,175,80,0.40);
  --alpha-green-60: rgba(76,175,80,0.60);
  --alpha-green-80: rgba(76,175,80,0.80);

  --alpha-yellow-5:  rgba(255,210,0,0.05);
  --alpha-yellow-15: rgba(255,210,0,0.15);
  --alpha-yellow-20: rgba(255,210,0,0.20);
  --alpha-yellow-40: rgba(255,210,0,0.40);
  --alpha-yellow-60: rgba(255,210,0,0.60);
  --alpha-yellow-80: rgba(255,210,0,0.80);

  --alpha-orange-5:  rgba(252,144,35,0.05);
  --alpha-orange-15: rgba(252,144,35,0.15);
  --alpha-orange-20: rgba(252,144,35,0.20);
  --alpha-orange-40: rgba(252,144,35,0.40);
  --alpha-orange-60: rgba(252,144,35,0.60);
  --alpha-orange-80: rgba(252,144,35,0.80);

  --alpha-purple-5:  rgba(154,93,202,0.05);
  --alpha-purple-15: rgba(154,93,202,0.15);
  --alpha-purple-20: rgba(154,93,202,0.20);
  --alpha-purple-40: rgba(154,93,202,0.40);
  --alpha-purple-60: rgba(154,93,202,0.60);
  --alpha-purple-80: rgba(154,93,202,0.80);

  --alpha-burple-5:  rgba(97,78,218,0.05);
  --alpha-burple-15: rgba(97,78,218,0.15);
  --alpha-burple-20: rgba(97,78,218,0.20);
  --alpha-burple-40: rgba(97,78,218,0.40);
  --alpha-burple-60: rgba(97,78,218,0.60);
  --alpha-burple-80: rgba(97,78,218,0.80);

  --alpha-red-5:  rgba(229,57,53,0.05);
  --alpha-red-15: rgba(229,57,53,0.15);
  --alpha-red-20: rgba(229,57,53,0.20);
  --alpha-red-40: rgba(229,57,53,0.40);
  --alpha-red-60: rgba(229,57,53,0.60);
  --alpha-red-80: rgba(229,57,53,0.80);

  /* =====================================================================
     LAYER 1 · BASE — Type primitives
     ===================================================================== */
  --font-family-display: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-family-body:    "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Weight names match Figma: Regular / Medium / Semibold / Bold / Extra */
  --font-weight-regular:  400;
  --font-weight-medium:   500;
  --font-weight-semibold: 600;
  --font-weight-bold:     700;
  --font-weight-extra:    800;

  /* Font sizes — every value present in Figma Base.Size */
  --font-size-7-5:  7.5px;
  --font-size-9:    9px;
  --font-size-10:   10px;
  --font-size-10-5: 10.5px;
  --font-size-12:   12px;
  --font-size-14:   14px;
  --font-size-16:   16px;
  --font-size-18:   18px;
  --font-size-20:   20px;
  --font-size-24:   24px;
  --font-size-28:   28px;
  --font-size-30:   30px;
  --font-size-32:   32px;
  --font-size-36:   36px;
  --font-size-40:   40px;
  --font-size-48:   48px;
  --font-size-54:   54px;
  --font-size-64:   64px;
  --font-size-72:   72px;

  /* Line heights — every value present in Figma Base.Line Height */
  --line-height-8:  8px;
  --line-height-10: 10px;
  --line-height-12: 12px;
  --line-height-13: 13px;
  --line-height-14: 14px;
  --line-height-16: 16px;
  --line-height-18: 18px;
  --line-height-20: 20px;
  --line-height-24: 24px;
  --line-height-26: 26px;
  --line-height-28: 28px;
  --line-height-30: 30px;
  --line-height-32: 32px;
  --line-height-34: 34px;
  --line-height-36: 36px;
  --line-height-38: 38px;
  --line-height-40: 40px;
  --line-height-44: 44px;
  --line-height-48: 48px;
  --line-height-54: 54px;
  --line-height-58: 58px;
  --line-height-68: 68px;
  --line-height-76: 76px;
  --line-height-90: 90px;

  /* Letter spacing — Figma values are em units */
  --tracking-none: 0;
  --tracking-sm:   0.15em;   /* Figma "SM (15)" */
  --tracking-md:   0.20em;   /* Figma "MD (20)" */
  --tracking-lg:   1.50em;   /* Figma "L (150)"  — eyebrows / overlines */

  /* =====================================================================
     LAYER 1 · BASE — Stroke / Radius
     ===================================================================== */
  --stroke-none: 0;
  --stroke-xs:   1px;
  --stroke-sm:   2px;
  --stroke-md:   3px;
  --stroke-lg:   4px;
  --stroke-xl:   6px;
  --stroke-2xl:  8px;
  --stroke-3xl:  10px;
  --stroke-4xl:  12px;

  --radius-none: 0;
  --radius-xxs:  2px;
  --radius-xs:   4px;
  --radius-s:    8px;
  --radius-m:    12px;
  --radius-l:    16px;
  --radius-xl:   24px;
  --radius-2xl:  48px;
  --radius-full: 999px;

  /* Back-compat aliases for the previous naming. */
  --radius-sm:   var(--radius-s);
  --radius-md:   var(--radius-m);
  --radius-lg:   var(--radius-l);

  /* =====================================================================
     LAYER 2 · SEMANTIC — Thematic (text / surface / border)
     Mirrors Figma "Themes / Light / Thematic".
     ===================================================================== */
  --text-primary:        var(--color-grey-90);   /* #1a1a1a */
  --text-secondary:      var(--color-grey-70);   /* #616161 */
  --text-disabled:       var(--color-grey-60);   /* #9e9e9e */
  --text-on-dark:        var(--color-white);
  --text-link:           var(--color-blue-100);

  --surface-default:     var(--color-white);
  --surface-subtle:      var(--color-grey-10);   /* #fafafa */
  --surface-muted:       var(--color-grey-30);   /* #eeeeee */
  --surface-disabled:    var(--color-grey-20);   /* #f5f5f5 */
  --surface-inverse:     var(--color-black);
  --surface-highlight-on-dark: var(--color-grey-80); /* #303030 */

  --border-default:      var(--color-grey-50);   /* #bdbdbd */
  --border-disabled:     var(--color-grey-40);   /* #e0e0e0 */
  --border-subtle:       var(--color-grey-30);   /* #eeeeee */
  --border-focus:        var(--color-blue-100);

  /* =====================================================================
     LAYER 2 · SEMANTIC — Status (Utilities)
     Each role has the full 6-stop palette so components can pick a
     surface tint (5/10), mid (50/100), or strong (120/140) variant.
     ===================================================================== */
  /* Info — Coalition Blue */
  --status-info-5:   var(--color-blue-5);
  --status-info-10:  var(--color-blue-10);
  --status-info-50:  var(--color-blue-50);
  --status-info-100: var(--color-blue-100);
  --status-info-120: var(--color-blue-120);
  --status-info-140: var(--color-blue-140);

  /* Success — Green */
  --status-success-5:   var(--color-green-5);
  --status-success-10:  var(--color-green-10);
  --status-success-50:  var(--color-green-50);
  --status-success-100: var(--color-green-100);
  --status-success-120: var(--color-green-120);
  --status-success-140: var(--color-green-140);

  /* Warning — Orange (NB: Figma uses Orange, not Yellow, for warnings) */
  --status-warning-5:   var(--color-orange-5);
  --status-warning-10:  var(--color-orange-10);
  --status-warning-50:  var(--color-orange-50);
  --status-warning-100: var(--color-orange-100);
  --status-warning-120: var(--color-orange-120);
  --status-warning-140: var(--color-orange-140);

  /* Error — Red */
  --status-error-5:   var(--color-red-5);
  --status-error-10:  var(--color-red-10);
  --status-error-50:  var(--color-red-50);
  --status-error-100: var(--color-red-100);
  --status-error-120: var(--color-red-120);
  --status-error-140: var(--color-red-140);

  /* AI — Burple */
  --status-ai-5:   var(--color-burple-5);
  --status-ai-10:  var(--color-burple-10);
  --status-ai-50:  var(--color-burple-50);
  --status-ai-100: var(--color-burple-100);
  --status-ai-120: var(--color-burple-120);
  --status-ai-140: var(--color-burple-140);

  /* =====================================================================
     LAYER 2 · SEMANTIC — Security severity
     Coalition-specific: cyber-risk severity scale.
     ===================================================================== */
  --severity-critical-5:   var(--color-red-5);
  --severity-critical-10:  var(--color-red-10);
  --severity-critical-50:  var(--color-red-50);
  --severity-critical-100: var(--color-red-100);
  --severity-critical-120: var(--color-red-120);
  --severity-critical-140: var(--color-red-140);

  --severity-high-5:   var(--color-orange-5);
  --severity-high-10:  var(--color-orange-10);
  --severity-high-50:  var(--color-orange-50);
  --severity-high-100: var(--color-orange-100);
  --severity-high-120: var(--color-orange-120);
  --severity-high-140: var(--color-orange-140);

  --severity-medium-5:   var(--color-yellow-5);
  --severity-medium-10:  var(--color-yellow-10);
  --severity-medium-50:  var(--color-yellow-50);
  --severity-medium-100: var(--color-yellow-100);
  --severity-medium-120: var(--color-yellow-120);
  --severity-medium-140: var(--color-yellow-140);

  --severity-low-5:   var(--color-teal-5);
  --severity-low-10:  var(--color-teal-10);
  --severity-low-50:  var(--color-teal-50);
  --severity-low-100: var(--color-teal-100);
  --severity-low-120: var(--color-teal-120);
  --severity-low-140: var(--color-teal-140);

  /* =====================================================================
     LAYER 2 · SEMANTIC — Brand / Accent
     The 8 single-tone accents are accessible by name.
     "Brand" aliases keep the Coalition Blue addressable as a single role
     name across components.
     ===================================================================== */
  --brand-primary:        var(--color-blue-100);
  --brand-primary-hover:  var(--color-blue-120);
  --brand-primary-pressed:var(--color-blue-140);
  --brand-primary-tint:   var(--color-blue-10);
  --brand-primary-subtle: var(--color-blue-5);

  --accent-sky:       var(--color-sky);
  --accent-turquoise: var(--color-turquoise);
  --accent-seafoam:   var(--color-seafoam);
  --accent-lime:      var(--color-lime);
  --accent-magenta:   var(--color-magenta);
  --accent-pink:      var(--color-pink);
  --accent-orangy:    var(--color-orangy);
  --accent-gold:      var(--color-gold);
  --accent-parchment: var(--color-parchment);
  --accent-sand:      var(--color-sand);
}

/* =========================================================================
   LEGACY COMPAT ALIASES
   The previous design system used a 9-stop ramp (100..900) and separate
   --color-error / --color-warning / --color-success / --color-accent ramps.
   These names are kept here as aliases over the new tokens so existing
   components continue to render unchanged. NEW work should use the
   semantic tokens above.

   Update plan: this block stays until every component has migrated to the
   semantic layer; then it can be deleted.
   ========================================================================= */
:root {
  /* ---- Primary (Coalition Blue) ---- */
  --color-primary-100: var(--color-blue-5);
  --color-primary-200: var(--color-blue-10);
  --color-primary-300: var(--color-blue-50);
  --color-primary-400: #558cde;                 /* interpolated, no Figma equiv */
  --color-primary-500: var(--color-blue-100);
  --color-primary-600: var(--color-blue-120);
  --color-primary-700: var(--color-blue-140);
  --color-primary-800: #0d2c57;                 /* interpolated, darker than 140 */
  --color-primary-900: #06172e;
  --color-primary:         var(--brand-primary);
  --color-primary-hover:   var(--brand-primary-hover);
  --color-primary-pressed: var(--brand-primary-pressed);
  --color-primary-tint:    var(--brand-primary-tint);
  --color-primary-tint-2:  var(--color-blue-50);
  --color-primary-soft:    var(--color-blue-100);
  --color-primary-surface: var(--color-blue-10);

  /* ---- Secondary (was cool-slate; map to grey scale) ---- */
  --color-secondary-100: var(--color-grey-30);
  --color-secondary-200: var(--color-grey-40);
  --color-secondary-300: var(--color-grey-50);
  --color-secondary-400: var(--color-grey-60);
  --color-secondary-500: var(--color-grey-70);
  --color-secondary-600: var(--color-grey-80);
  --color-secondary-700: var(--color-grey-90);
  --color-secondary-800: var(--color-black);

  /* ---- Neutrals (legacy 0..1000 → grey-10..90) ---- */
  --color-neutral-0:    var(--color-white);
  --color-neutral-50:   var(--color-grey-10);
  --color-neutral-100:  var(--color-grey-20);
  --color-neutral-200:  var(--color-grey-30);
  --color-neutral-300:  var(--color-grey-40);
  --color-neutral-400:  var(--color-grey-50);
  --color-neutral-500:  var(--color-grey-60);
  --color-neutral-600:  #757575;
  --color-neutral-700:  var(--color-grey-70);
  --color-neutral-800:  #424242;
  --color-neutral-900:  #212121;
  --color-neutral-1000: var(--color-grey-90);

  /* ---- Accent (was a coral red ramp; map to red palette) ---- */
  --color-accent-100: var(--color-red-5);
  --color-accent-200: var(--color-red-10);
  --color-accent-300: var(--color-red-50);
  --color-accent-400: var(--color-red-100);
  --color-accent-500: var(--color-red-120);
  --color-accent-600: var(--color-red-140);
  --color-accent-700: var(--color-red-140);

  /* ---- Error / Warning / Success / Info ramps ---- */
  --color-error-100: var(--status-error-5);
  --color-error-200: var(--status-error-10);
  --color-error-300: var(--status-error-50);
  --color-error-400: #d96356;
  --color-error-500: var(--status-error-100);
  --color-error-600: var(--status-error-120);
  --color-error-700: #c21952;
  --color-error-800: var(--status-error-140);

  --color-warning-100: var(--status-warning-5);
  --color-warning-200: var(--status-warning-10);
  --color-warning-300: var(--status-warning-50);
  --color-warning-400: var(--status-warning-100);
  --color-warning-500: var(--status-warning-100);
  --color-warning-600: var(--status-warning-120);
  --color-warning-700: var(--status-warning-140);

  --color-success-100: var(--status-success-5);
  --color-success-200: var(--status-success-10);
  --color-success-300: var(--status-success-50);
  --color-success-400: #49d685;

  --color-success-700: var(--status-success-120);
  --color-success-800: var(--status-success-140);

  --color-info-100: var(--status-info-5);
  --color-info-500: var(--status-info-100);

  /* ---- fg / bg / border semantic legacy aliases ---- */
  --fg-primary:    var(--text-primary);
  --fg-secondary:  var(--text-secondary);
  --fg-tertiary:   var(--color-grey-60);
  --fg-disabled:   var(--text-disabled);
  --fg-on-primary: var(--text-on-dark);
  --fg-link:       var(--text-link);

  --bg-primary:    var(--surface-default);
  --bg-secondary:  var(--surface-subtle);
  --bg-tertiary:   var(--surface-disabled);
  --bg-canvas:     #f7f9fc;
  --bg-sunken:     var(--surface-muted);

  /* ---- Spacing scale ---- */
  --space-none: 0;
  --space-3xs: 2px;
  --space-2xs: 4px;
  --space-xs:  8px;
  --space-sm:  12px;
  --space-md:  16px;

  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 4px 0 8px 0;
  color: var(--text-secondary);
  font-size: 13px;
}
.cp-breadcrumb a, .cp-breadcrumb .cp-bc-link {
  color: var(--text-secondary); cursor: pointer; text-decoration: none;
}
.cp-breadcrumb a:hover { text-decoration: underline; }
.cp-breadcrumb .cp-bc-current { color: var(--text-primary); }
.cp-breadcrumb .cp-bc-actions { display: flex; align-items: center; gap: 8px; color: var(--brand-primary); }
.cp-breadcrumb .cp-bc-actions .cp-open-link {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--brand-primary); cursor: pointer;
  font-size: 13px;
}
.cp-breadcrumb .cp-bc-actions .cp-open-link .material-icons { font-size: 16px; }
.cp-icon-btn {
  width: 32px; height: 32px;
  border-radius: 6px; border: 1px solid var(--color-grey-40);
  background: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary);
  padding: 0;
}
.cp-icon-btn:hover { background: var(--color-grey-10); color: var(--text-primary); }
.cp-icon-btn.active { background: var(--color-blue-10); color: var(--brand-primary); border-color: var(--color-blue-10); }
.cp-icon-btn .material-icons-outlined,
.cp-icon-btn .material-icons { font-size: 18px; }

/* ---- Account header (title + kebab) ---- */
.cp-account-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 8px 0 16px 0;
}
.cp-account-head h1 {
  font-family: var(--font-family-body);
  font-weight: 700;
  font-size: 32px;
  line-height: 38px;
  letter-spacing: -0.2px;
  margin: 0;
}
.cp-kebab {
  width: 36px; height: 36px;
  border: 1px solid var(--color-grey-40);
  background: #fff;
  border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; color: var(--text-secondary);
  position: relative;
}
.cp-kebab:hover { background: var(--color-grey-10); color: var(--text-primary); }
.cp-kebab .material-icons { font-size: 20px; }

/* ---- Generic card ---- */
.cp-card {
  background: #fff;
  border: 1px solid var(--color-grey-30);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.cp-card-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.cp-card-title {
  font: 700 18px/24px var(--font-family-body);
  color: var(--text-primary);
}

/* Definition list (Agency / Address …) */
.cp-dl {
  display: grid;
  grid-template-columns: 140px 1fr;
  row-gap: 8px; column-gap: 12px;
  font-size: 14px;
}
.cp-dl dt { color: var(--text-primary); }
.cp-dl dd { margin: 0; color: var(--text-primary); }
.cp-link { color: var(--brand-primary); cursor: pointer; }
.cp-link:hover { text-decoration: underline; }
.cp-uuid { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--text-primary); display: inline-flex; gap: 8px; align-items: center; }
.cp-domain-pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px;
  border-radius: 4px;
  background: var(--color-blue-5); color: var(--brand-primary);
  font-size: 13px; font-weight: 500;
}
.cp-more-toggle {
  font-size: 14px; color: var(--text-primary); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 8px;
}
.cp-more-toggle .material-icons { font-size: 16px; }
.cp-edit-inline {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--brand-primary); cursor: pointer; font-size: 14px; font-weight: 500;
}
.cp-edit-inline .material-icons-outlined { font-size: 14px; }

/* Tabs */
.cp-tabs {
  display: flex; gap: 24px;
  border-bottom: 1px solid var(--color-grey-30);
  margin: 8px 0 16px 0;
}
.cp-tab {
  padding: 10px 0; cursor: pointer;
  font-size: 16px; font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 8px;
}
.cp-tab.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
.cp-tab .cp-pill { font-size: 11px; padding: 2px 8px; background: var(--color-grey-20); color: var(--text-secondary); border-radius: 999px; font-weight: 600; letter-spacing: 0.2px; }

/* Cyber summary specific */
.cp-cyber-head { justify-content: space-between; }
.cp-quote-pill {
  display: inline-flex; align-items: center; height: 22px;
  padding: 0 8px; border-radius: 999px; font: 600 12px/1 var(--font-family-body);
  background: var(--color-green-10); color: var(--color-green-140);
}
.cp-summary-tail { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
.cp-toggle {
  width: 32px; height: 18px; border-radius: 999px;
  background: var(--color-green-100); position: relative; flex: 0 0 32px;
}
.cp-toggle::after {
  content: ''; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; position: absolute; right: 2px; top: 2px;
}

/* Table-ish blocks */
.cp-subcard {
  background: #fff;
  border: 1px solid var(--color-grey-30);
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 16px;
}
.cp-subcard-title {
  font: 700 14px/18px var(--font-family-body);
  padding-bottom: 8px;
}
.cp-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.cp-table thead th {
  text-align: left; padding: 8px 8px 8px 0;
  color: var(--text-secondary);
  font-weight: 600; font-size: 12px;
  border-bottom: 1px solid var(--color-grey-30);
}
.cp-table tbody td {
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--color-grey-30);
  vertical-align: top;
}
.cp-table tbody tr:last-child td { border-bottom: 0; }
.cp-tr-selectable { cursor: pointer; }
.cp-tr-selectable:hover { background: var(--color-grey-10); }
.cp-tr-selected { background: var(--color-blue-5); }
.cp-tr-selected td:first-child { box-shadow: inset 2px 0 0 var(--brand-primary); }

/* Status badges */
.cp-badge {
  display: inline-flex; align-items: center; height: 22px;
  padding: 0 8px; border-radius: 4px; font: 600 12px/1 var(--font-family-body);
}
.cp-badge--active   { background: var(--color-green-10); color: var(--color-green-140); }
.cp-badge--policy   { background: var(--color-blue-10);  color: var(--color-blue-140); }
.cp-badge--expired  { background: var(--color-grey-30);  color: var(--text-secondary); }
.cp-badge--open     { background: var(--color-red-10);   color: var(--color-red-140); }
.cp-badge--closed   { background: var(--color-grey-30);  color: var(--text-secondary); }
.cp-badge--quoted   { background: var(--color-green-10); color: var(--color-green-140); }
.cp-badge--pending  { background: var(--color-orange-10); color: var(--color-orange-140); }
.cp-badge--completed{ background: var(--color-green-10); color: var(--color-green-140); }

/* Checkbox */
.cp-chk {
  width: 16px; height: 16px;
  border: 1.5px solid var(--color-grey-50); border-radius: 3px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: #fff;
  flex: 0 0 16px;
}
.cp-chk.checked { background: var(--brand-primary); border-color: var(--brand-primary); }
.cp-chk.checked::after {
  content: ''; width: 8px; height: 4px;
  border: 2px solid #fff; border-top: 0; border-right: 0;
  transform: rotate(-45deg) translate(0, -1px);
}
.cp-chk.indet { background: var(--brand-primary); border-color: var(--brand-primary); }

}

.cp-bulkbar-kebab { padding: 0 8px; }
.cp-bulkbar-overflow {
  position: absolute;
  bottom: calc(100% + 8px);

  min-width: 180px;
  background: #fff;
  border: 1px solid var(--color-grey-30);

  box-shadow: var(--elevation-4);
  padding: 4px;
  z-index: 31;
  color: var(--text-primary);
}
.cp-bulkbar-overflow .cp-menu-item { border-radius: 6px; }

/* Legacy inline bulk bar (kept for any callers that still reference it) */
.cp-bulkbar {
  display: flex; align-items: center; gap: 16px;
  background: var(--color-blue-5);
  border: 1px solid var(--color-blue-10);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 10px;
  animation: bulkbar-in 0.18s cubic-bezier(.4,0,.2,1);
}
@keyframes bulkbar-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.cp-bulkbar-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.cp-bulkbar-count { font-size: 13px; color: var(--color-blue-140); }
.cp-bulkbar-count strong { color: var(--color-blue-140); }
.cp-bulkbar-clear {
  font-size: 12px; color: var(--brand-primary); cursor: pointer; font-weight: 500;
  padding: 2px 6px; border-radius: 4px;
}
.cp-bulkbar-clear:hover { background: var(--color-blue-10); }
.cp-bulkbar-actions { display: flex; gap: 8px; }
.cp-bulkbar .tx-btn { height: 30px; font-size: 13px; }
.cp-bulkbar .tx-btn--secondary { background: #fff; }

/* Activity feed */
.cp-feed {
  border-left: 1px solid var(--color-grey-30);
  padding: 16px 20px;
  overflow-y: auto;
  background: #fff;
  min-width: 0;
}
.cp-feed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cp-feed-head h2 { font: 700 18px/24px var(--font-family-body); margin: 0; }
.cp-filter-row { display: flex; gap: 8px; margin-bottom: 16px; }
.cp-filter {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500;
  background: #fff; border: 1px solid var(--color-grey-40); border-radius: 6px;
  color: var(--text-secondary);
}
.cp-filter .material-icons-outlined { font-size: 14px; }
.cp-feed-item { display: flex; gap: 10px; margin-bottom: 16px; }
.cp-feed-ico {
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--color-blue-10); color: var(--brand-primary);
  display: inline-flex; align-items: center; justify-content: center;
  flex: 0 0 28px; margin-top: 2px;
}
.cp-feed-ico .material-icons-outlined,
.cp-feed-ico .material-icons { font-size: 16px; }
.cp-feed-body { flex: 1; min-width: 0; font-size: 13px; }
.cp-feed-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cp-feed-title strong { font-weight: 600; }
.cp-feed-time { color: var(--text-secondary); font-size: 12px; flex: 0 0 auto; }
.cp-feed-card {
  margin-top: 8px;
  padding: 10px 12px;
  background: var(--color-grey-10);
  border-radius: 8px;
  font-size: 13px;
  line-height: 18px;
}
.cp-feed-card .row { display: flex; gap: 4px; }
.cp-feed-card .row dt { color: var(--text-secondary); flex: 0 0 auto; }
.cp-feed-card .row dd { margin: 0; }

/* Kebab menu */
.cp-menu {
  position: absolute;
  background: #fff;
  border: 1px solid var(--color-grey-30);
  border-radius: 8px;
  box-shadow: var(--elevation-3);
  padding: 6px;

}
.cp-menu-item {
  display: flex; align-items: center; gap: 10px;

.cp-menu-item:hover { background: var(--color-blue-5); }
.cp-menu-item .material-icons-outlined,

.cp-menu-divider { height: 1px; background: var(--color-grey-30); margin: 4px 0; }
.cp-menu-section {
  font: 600 11px/14px var(--font-family-body);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-secondary);

}

.tx-btn .material-icons-outlined,

  <script type="text/babel" data-source="primitives.jsx">
// Shared primitives for the account page + transfer surfaces.
// All exports go to window so other Babel scripts can use them.

const Icon = ({ name, kind = 'outlined', size, style = {}, className = '' }) => {
  const cls = kind === 'filled' ? 'material-icons' : 'material-icons-outlined';
  return (
    <span className={cls + ' ' + className} style={{ fontSize: size, ...style }}>{name}</span>);

};

const Avatar = ({ children, color = 'orange', size = 32 }) => {
  const colors = {
    orange: { bg: 'var(--color-orange-100)', fg: '#fff' },
    blue: { bg: 'var(--color-blue-10)', fg: 'var(--brand-primary)' },
    grey: { bg: 'var(--color-grey-30)', fg: 'var(--text-secondary)' },
    green: { bg: 'var(--color-green-10)', fg: 'var(--color-green-140)' },
    purple: { bg: 'var(--color-purple-10)', fg: 'var(--color-purple-140)' }
  };
  const c = colors[color] || colors.orange;
  return (
    <span style={{
      width: size, height: size, borderRadius: 999,
      background: c.bg, color: c.fg,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      fontWeight: 600, fontSize: size <= 24 ? 10 : 12, flex: `0 0 ${size}px`,
      letterSpacing: '0.4px'
    }}>{children}</span>);

};

const Checkbox = ({ checked, indet, onChange }) =>
<span
  className={'cp-chk ' + (indet ? 'indet' : checked ? 'checked' : '')}
  onClick={(e) => {e.stopPropagation();onChange && onChange(!checked);}} />;



// Click-outside helper hook
function useOutsideClick(ref, handler) {
  React.useEffect(() => {
    const onDown = (e) => {
      if (!ref.current) return;
      if (!ref.current.contains(e.target)) handler(e);
    };
    document.addEventListener('mousedown', onDown);

  id: 'erdo', label: 'ER-D&O',
  quotes: [
  { cpn: 'C-4LV7-368875-DNO-2025', limit: '$3M/$50K/$5,400', address: '88 Harbor St, Providence, RI', status: 'Active' }],

  policies: []
};
const BADGE_CLASS = { Active: 'active', Policy: 'policy', Expired: 'expired', Bound: 'policy' };

function linesFor(multi) {return multi ? [CYBER, ER_CRIME, ER_DO] : [CYBER];}
function itemsOf(line) {
  return [
  ...line.quotes.map((q, i) => ({ key: line.id + ':q' + i, kind: 'q', ...q })),
  ...line.policies.map((p, i) => ({ key: line.id + ':p' + i, kind: 'p', ...p }))];

}
function allKeys(multi) {return linesFor(multi).flatMap((l) => itemsOf(l).map((it) => it.key));}
function itemByKey(multi, key) {return linesFor(multi).flatMap(itemsOf).find((it) => it.key === key);}

    const next = new Set(st.picked);

    </label>;

  const quotes = items.filter((it) => it.kind === 'q');
  const policies = items.filter((it) => it.kind === 'p');
  return (
    <div>
      <label className="tx-label">
        Items to transfer
        <span style={{ fontWeight: 400, color: 'var(--text-secondary)', marginLeft: 6 }}>{st.picked.size} selected</span>
        <span onClick={toggleAll} style={{ float: 'right', fontSize: 12, color: 'var(--brand-primary)', cursor: 'pointer', fontWeight: 500 }}>{(allActiveSel ? 'Deselect all' : 'Select all') + (multi ? ' in ' + active.label : '')}</span>
      </label>
      <div style={{ border: '1px solid var(--color-grey-30)', borderRadius: 8, overflow: 'hidden' }}>
        {multi &&
        <div style={{ display: 'flex', gap: 18, padding: '0 14px', background: 'var(--color-grey-10)', borderBottom: '1px solid var(--color-grey-30)' }}>
            {lines.map((l) => {
            const on = l.id === active.id;const c = lineSel(l);
            return (
              <button key={l.id} onClick={() => set({ activeLine: l.id })} style={{ background: 'none', border: 0, borderBottom: '2px solid ' + (on ? 'var(--brand-primary)' : 'transparent'), padding: '9px 2px', marginBottom: -1, cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: on ? 600 : 500, color: on ? 'var(--text-primary)' : 'var(--text-secondary)', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                  {l.label}
                  {c > 0 && <span style={{ fontSize: 11, fontWeight: 600, background: 'var(--color-blue-10)', color: 'var(--brand-primary)', borderRadius: 999, padding: '0 6px', minWidth: 18, textAlign: 'center' }}>{c}</span>}
                </button>);

          })}
          </div>
        }
        <SectionHdr>Quotes</SectionHdr>
        {quotes.map((it) => <Row key={it.key} it={it} />)}
        {policies.length > 0 && <SectionHdr top>Policies</SectionHdr>}
        {policies.map((it) => <Row key={it.key} it={it} />)}
      </div>
    </div>);

}

function MoveTab({ multi, st, set }) {
  const chosen = st.dest != null;
  const isNew = st.dest === 'NEW';
  const allSel = st.picked.size > 0 && st.picked.size === allKeys(multi).length;
  const variant = isNew ? 'new' : allSel ? 'all' : 'subset';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <FromTo toLabel={isNew ? 'New account' : 'Destination account'} toNode={<DestAccountField multi={multi} st={st} set={set} />} />
      {chosen && <MoveNote variant={variant} />}
      {chosen && <ItemPicker multi={multi} st={st} set={set} />}
    </div>);

}

// ── Center states (submit / done) ─────────────────────────
function CenterState({ spinner, icon, iconColor, iconBg, title, sub }) {
  return (
    <div style={{ padding: '44px 24px 40px', textAlign: 'center' }}>
      {spinner ?
      <div className="ma-spinner" style={{ margin: '0 auto 18px' }} /> :
      <div style={{ width: 64, height: 64, borderRadius: 999, background: iconBg, color: iconColor, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 14 }}><Icon name={icon} kind="filled" size={36} /></div>}
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13, color: 'var(--text-secondary)', lineHeight: 1.5, maxWidth: 420, margin: '0 auto' }}>{sub}</div>
    </div>);

}

// ── The modal ─────────────────────────────────────────────
const initialState = (multi, picked) => ({
  brokerId: null, ownLines: new Set(linesFor(multi).map((l) => l.id)), rulesOpen: false, rule: 'transfer',
  advOpen: false, adv: { w2r: false, crossAgency: false, crossBind: false }, destAcct: null,
  dest: null, picked: picked && picked.length ? new Set(picked) : new Set(), activeLine: 'cyber'
});

function ManageAccountModal({ multi, onClose, initialTab = 'ownership', initialPicked = null, advanced = false, destMatch = 'none' }) {
  const toast = useToast();
  const [tab, setTab] = React.useState(initialTab);
  const [phase, setPhase] = React.useState('edit'); // edit | submitting | done
  const [mode, setMode] = React.useState('initiate'); // initiate | direct
  const [st, setSt] = React.useState(() => initialState(multi, initialPicked));
  const set = (patch) => setSt((s) => ({ ...s, ...patch }));

  React.useEffect(() => {
    const onKey = (e) => {if (e.key === 'Escape') onClose();};
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  // ── derive footer + validity per tab ──
  const lines = linesFor(multi);
  let footerLeft = null,canSubmit = false,doneTitle = '',doneSub = '';
  if (tab === 'ownership') {
    const chosenLines = lines.filter((l) => st.ownLines.has(l.id));
    const q = chosenLines.reduce((n, l) => n + l.quotes.length, 0);
    const p = chosenLines.reduce((n, l) => n + l.policies.length, 0);
    const broker = st.brokerId && window.BROKERS.find((b) => b.id === st.brokerId);
    const needDest = destMatch === 'matches';
    const destPicked = !needDest || st.destAcct != null;
    canSubmit = !!broker && destPicked;
    footerLeft = !broker ?
    <span style={{ color: 'var(--text-disabled)' }}>Pick a destination broker to continue.</span> :
    needDest && st.destAcct == null ?
    <span style={{ color: 'var(--text-disabled)' }}>Select a matching account or create a new one.</span> :
    <Impact>{multi ? <><strong>{st.ownLines.size} line{st.ownLines.size > 1 ? 's' : ''}</strong> · {q} quotes{p ? ' & ' + p + ' policy' : ''}</> : <><strong>{q} quotes</strong> &amp; {p} policy</>} → <strong>{broker.name}</strong> @ {broker.agency}</Impact>;
    doneTitle = 'Ownership changed';
    doneSub = broker ? <>{SOURCE.name} is now owned by <strong>{broker.name}</strong> @ {broker.agency}.</> : '';
  } else {
    const n = st.picked.size;
    canSubmit = st.dest != null && n > 0;
    const destName = st.dest === 'NEW' ? 'new account' : st.dest ? ACCOUNTS.find((a) => a.id === st.dest).name : '';
    footerLeft = st.dest == null ?
    <span style={{ color: 'var(--text-disabled)' }}>Pick a destination account to choose items.</span> :
    n === 0 ?
    <span style={{ color: 'var(--text-disabled)' }}>Select quotes &amp; policies to move.</span> :
    <Impact><strong>{n} item{n > 1 ? 's' : ''}</strong> → <strong>{destName}</strong></Impact>;
    doneTitle = st.dest === 'NEW' ? 'New account created' : 'Items transferred';
    doneSub = st.dest === 'NEW' ?
    <>{n} item{n > 1 ? 's' : ''} split into a new account. {SOURCE.name} stays open with the rest.</> :
    <>{n} item{n > 1 ? 's' : ''} transferred to <strong>{destName}</strong>.</>;
  }

  const submit = (m) => {
    setMode(m);
    setPhase('submitting');
    setTimeout(() => setPhase('done'), 1500);
  };
  const finish = () => {
    onClose();
    toast && toast(tab === 'ownership' ? 'Ownership changed' : 'Items transferred');
  };
  const switchTab = (t) => {if (t !== tab) {setTab(t);}};

  return (
    <div onMouseDown={(e) => {if (e.target === e.currentTarget) onClose();}}
    style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: 24 }}>
      <div role="dialog" aria-modal="true" data-screen-label="Manage account"
      style={{ width: 680, maxHeight: '88vh', background: '#fff', borderRadius: 16, boxShadow: 'var(--elevation-5)', display: 'flex', flexDirection: 'column', overflow: 'hidden', fontFamily: 'var(--font-family-body)', color: 'var(--text-primary)' }}>

        {/* Header */}
        <div style={{ padding: '20px 24px 12px', display: 'flex', alignItems: 'flex-start', gap: 12, flex: '0 0 auto' }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 20, lineHeight: '26px' }}>Manage account</div>
            <div style={{ marginTop: 4, color: 'var(--text-secondary)', fontSize: 14 }}>{SOURCE.name}</div>
          </div>
          <button className="cp-icon-btn" onClick={onClose}><Icon name="close" /></button>
        </div>

        {phase === 'edit' &&
        <>
            {/* Tabs */}
            <div style={{ padding: '8px 24px 0', flex: '0 0 auto' }}>
              <div style={{ display: 'flex', background: 'var(--color-grey-10)', borderRadius: 8, padding: 4, gap: 4 }}>
                {[{ id: 'ownership', label: 'Change ownership', ico: 'swap_horiz' }, { id: 'move', label: 'Transfer quotes/policies', ico: 'alt_route' }].map((m) => {
                const on = m.id === tab;
                return (
                  <button key={m.id} onClick={() => switchTab(m.id)} style={{ flex: 1, height: 36, borderRadius: 6, background: on ? '#fff' : 'transparent', border: 0, boxShadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none', fontWeight: on ? 600 : 500, color: on ? 'var(--text-primary)' : 'var(--text-secondary)', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 14, fontFamily: 'inherit' }}>
                      <Icon name={m.ico} size={16} />{m.label}
                    </button>);

              })}
              </div>
            </div>

            {/* Body (scrollable) */}
            <div style={{ padding: '18px 24px 20px', overflowY: 'auto', flex: '1 1 auto' }}>
              {tab === 'ownership' ?
            <OwnershipTab multi={multi} advanced={advanced} destMatch={destMatch} st={st} set={set} /> :
            <MoveTab multi={multi} st={st} set={set} />}
            </div>

            {/* Footer — live impact stacked above actions so the row never crowds */}
            <div style={{ borderTop: '1px solid var(--color-grey-30)', flex: '0 0 auto' }}>
              <div style={{ padding: '12px 24px 0', fontSize: 13, color: 'var(--text-secondary)', display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>{footerLeft}</div>
              <div style={{ padding: '12px 24px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
                <button className="tx-btn tx-btn--secondary" onClick={onClose}>Cancel</button>
                <div style={{ flex: 1 }} />
                <Tip text="Transfers immediately and overrides — no broker confirmation required.">
                  <button className="tx-btn tx-btn--secondary" disabled={!canSubmit} onClick={() => submit('direct')} aria-label="Direct transfer — no broker confirmation required">Direct transfer</button>
                </Tip>
                <Tip text="Requests confirmation first — sends BOR emails to both brokers before the transfer completes.">
                  <button className="tx-btn tx-btn--primary" disabled={!canSubmit} onClick={() => submit('initiate')} aria-label="Initiate transfer — requests broker confirmation by email">Initiate transfer</button>
                </Tip>
              </div>
            </div>
          </>
        }

        {phase === 'submitting' &&
        <CenterState spinner title={tab === 'ownership' ? 'Transferring ownership…' : 'Transferring items…'} sub={
          mode === 'direct' ?
          (tab === 'ownership' ? 'Directly transferring ownership and updating records — no broker confirmation required.' : 'Directly transferring the selected items — no broker confirmation required.') :
          (tab === 'ownership' ? 'Sending BOR emails to the existing and destination broker, and updating ownership.' : 'Notifying the brokers by email and re-assigning the selected items.')} />
        }

        {phase === 'done' &&
        <>
            <CenterState icon="check_circle" iconColor="var(--color-green-100)" iconBg="var(--color-green-10)" title={doneTitle} sub={doneSub} />
            <div style={{ padding: '16px 24px', borderTop: '1px solid var(--color-grey-30)', display: 'flex', justifyContent: 'flex-end', gap: 12 }}>
              {tab === 'move' && (() => {
              const dn = st.dest === 'NEW' ? 'new account' : st.dest ? (ACCOUNTS.find((a) => a.id === st.dest) || {}).name : '';
              return <button className="tx-btn tx-btn--secondary" onClick={() => {onClose();toast && toast('Opening ' + dn + '…');}}>View {dn}</button>;
            })()}
              <button className="tx-btn tx-btn--primary" onClick={finish}>Done</button>
            </div>
          </>
        }
      </div>
    </div>);

}

function Impact({ children }) {
  return (
    <>
      <Icon name="east" size={16} style={{ color: 'var(--color-grey-60)', flex: '0 0 auto' }} />
      <span style={{ lineHeight: 1.4 }}>{children}</span>
    </>);

}

Object.assign(window, { ManageAccountModal });
</script>
  <script type="text/babel" data-source="manage-account-app.jsx">
// manage-account-app.jsx — demo launcher for the interactive Manage account modal.
// A light account-page backdrop + a single/multi-line scenario toggle + the trigger.

const { Icon, Avatar, ToastHost, ManageAccountModal } = window;

function ScenarioToggle({ multi, onChange }) {
  const opts = [
    { id: false, label: 'Single line (Cyber)' },
    { id: true, label: 'Multi-line (Cyber + ER)' },
  ];
  return (
    <div style={{ display: 'inline-flex', background: 'var(--color-grey-10)', borderRadius: 8, padding: 4, gap: 4 }}>
      {opts.map((o) => {
        const on = o.id === multi;
        return (
          <button key={String(o.id)} onClick={() => onChange(o.id)} style={{
            height: 32, padding: '0 14px', borderRadius: 6, border: 0,
            background: on ? '#fff' : 'transparent', boxShadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',
            fontWeight: on ? 600 : 500, fontSize: 13, fontFamily: 'inherit',
            color: on ? 'var(--text-primary)' : 'var(--text-secondary)', cursor: 'pointer'
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

function Backdrop({ multi, onOpen }) {
  return (
    <div style={{ maxWidth: 1080, margin: '0 auto', padding: '40px 32px' }}>
      {/* Account header */}
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
        <Avatar color="orange" size={48}>ZT</Avatar>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--text-primary)' }}>ZeroDay Tech Solutions LLC</div>
          <div style={{ fontSize: 13, color: 'var(--text-secondary)', display: 'flex', gap: 8, alignItems: 'center', marginTop: 4 }}>
            <span>zerodaytech.com</span><span style={{ color: 'var(--color-grey-50)' }}>·</span>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="person" size={13} />Steven Stevens @ Blue &amp; Blue</span>
            <span style={{ color: 'var(--color-grey-50)' }}>·</span><span>RI</span>
          </div>
        </div>
        <button className="tx-btn tx-btn--primary" onClick={onOpen} style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <Icon name="manage_accounts" size={18} />Manage account
        </button>
      </div>

      <div style={{ height: 1, background: 'var(--color-grey-30)', margin: '24px 0' }} />

      {/* Hint card */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '16px 18px', border: '1px dashed var(--color-grey-40)', borderRadius: 12, background: 'var(--color-grey-10)' }}>
        <Icon name="touch_app" size={22} style={{ color: 'var(--brand-primary)' }} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-primary)' }}>Interactive prototype</div>
          <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginTop: 2 }}>Click <strong>Manage account</strong> to open the modal. Both tabs work: search a broker / account, pick lines &amp; items, expand ownership rules, create a new account, and submit.</div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: 'var(--text-secondary)' }}>Scenario</span>
          <ScenarioToggle multi={multi.value} onChange={multi.set} />
        </div>
      </div>
    </div>
  );
}

function App() {
  const [open, setOpen] = React.useState(false);
  const [multi, setMulti] = React.useState(false);
  return (
    <ToastHost>
      <div style={{ minHeight: '100vh', background: 'var(--bg-canvas, #fafafa)', fontFamily: 'var(--font-family-body)' }}>
        <Backdrop multi={{ value: multi, set: setMulti }} onOpen={() => setOpen(true)} />
        {open && <ManageAccountModal key={multi ? 'm' : 's'} multi={multi} onClose={() => setOpen(false)} />}
      </div>
    </ToastHost>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
